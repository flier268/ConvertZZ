<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>ConvertZZ 2.0</title>
    <script>
      const windowKind = new URLSearchParams(location.search).get("window");
      if (windowKind === "floating") document.documentElement.classList.add("floating-window");
      if (windowKind === "toast") document.documentElement.classList.add("toast-window");
    </script>
    <style>
      html.floating-window,
      html.floating-window body,
      html.toast-window,
      html.toast-window body {
        background: transparent !important;
        background-color: transparent !important;
      }
      html.floating-window,
      html.floating-window body,
      html.floating-window #app {
        width: 72px;
        height: 72px;
        overflow: hidden;
      }
      html.floating-window,
      html.floating-window * {
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
