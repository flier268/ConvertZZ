name: CI

on:
  push:
    # 任何分支的 push 都跑 CI（以後新增的分支也適用）。
    # 只列 branches、不列 tags，推 v* 標籤時不會觸發，以免與 Release 重複（Release 已跑 pnpm check 與 cargo test）。
    branches:
      - "**"
  # 同一個 repo 分支開的 PR，其 commit 已由上面的 push 跑過；每個 job 以 if 只讓 fork 來的 PR 執行，
  # 避免同一個 commit 被 push 和 PR 各跑一次。
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: 安裝相依套件
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ci
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: 安裝 Linux 建置套件
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ffmpeg libayatana-appindicator3-dev libdbus-1-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev pkg-config
      - name: 檢查前端
        run: pnpm run check
      - name: 執行 Rust 核心測試
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace -- --test-threads=1

  e2e:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: 安裝相依套件
        run: pnpm install --frozen-lockfile
      - name: 安裝 Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: 執行前端 e2e
        run: pnpm run test:e2e

  rust-format:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: 檢查 Rust 格式
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
