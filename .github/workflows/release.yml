name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 發行標籤
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            # WiX/MSI 只接受純數字預發行號；2.0.0-beta1 這類標籤改只產 NSIS。
            bundles: nsis
          - os: ubuntu-22.04
            artifact: linux-x64
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release
      - name: 安裝 Linux 建置套件
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libayatana-appindicator3-dev libdbus-1-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config rpm
      - name: 確認更新私鑰
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "請設定 GitHub Secret TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi
      - name: 安裝相依套件
        run: pnpm install --frozen-lockfile
      - name: 執行測試
        run: pnpm run check
      - name: 建立安裝包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json
      - name: 建立 Windows 免安裝版
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          node scripts/package-windows-portable.mjs \
            --release-dir src-tauri/target/release \
            --version "$version" \
            --out-dir src-tauri/target/release/bundle/portable
      - name: 離線驗證 AppImage 內的轉換核心
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#appimages[@]}" -eq 1
          unshare --user --map-root-user --net \
            node scripts/verify-linux-appimage.mjs \
            "${appimages[0]}" \
            tests/fixtures/mac-399.ape \
            tests/fixtures/test.ogg
      - name: 建立 Linux SHA-256
        if: runner.os == 'Linux'
        shell: bash
        run: sha256sum src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm > SHA256SUMS-linux-x64.txt
      - name: 記錄 Linux 執行相依
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          report="RUNTIME-DEPENDENCIES-linux-x64.txt"
          {
            echo "ConvertZZ Linux runtime dependency report"
            echo
            for package in src-tauri/target/release/bundle/deb/*.deb; do
              echo "DEB: $(basename "$package")"
              dpkg-deb --field "$package" Depends
              echo
            done
            for package in src-tauri/target/release/bundle/rpm/*.rpm; do
              echo "RPM: $(basename "$package")"
              rpm -qpR "$package"
              echo
            done
            echo "AppImage: Tauri collected shared libraries are bundled."
            echo "AppImage media framework bundling: disabled."
          } > "$report"

          if grep -Eiq '(^|[[:space:],])(nodejs|npm|build-essential|pkg-config|[^[:space:],]+-dev)([[:space:],]|$)' "$report"; then
            echo "Build-only dependency leaked into release metadata."
            cat "$report"
            exit 1
          fi
      - name: 建立 Windows SHA-256
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle -File -Recurse | Where-Object {
            $_.Extension -in '.exe', '.zip'
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding utf8NoBOM SHA256SUMS-windows-x64.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.sig
            SHA256SUMS-*.txt
            RUNTIME-DEPENDENCIES-*.txt
          if-no-files-found: error

  draft-release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: 設定版本字串
        run: echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: 建立 latest.json
        run: |
          node scripts/write-latest-json.mjs \
            --dir artifacts \
            --tag "${{ env.RELEASE_TAG }}" \
            --repo "${{ github.repository }}" \
            --out artifacts/latest.json
      - name: 建立草稿 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          body: |
            ## 下載說明

            | 平台 | 建議檔案 | 說明 |
            | --- | --- | --- |
            | Windows x64（安裝版） | [`ConvertZZ_${{ env.RELEASE_VERSION }}_x64-setup.exe`](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/ConvertZZ_${{ env.RELEASE_VERSION }}_x64-setup.exe) | NSIS 安裝程式；支援應用程式內自動更新 |
            | Windows x64（免安裝版） | [`ConvertZZ_${{ env.RELEASE_VERSION }}_x64-portable.zip`](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/ConvertZZ_${{ env.RELEASE_VERSION }}_x64-portable.zip) | 解壓後執行 `ConvertZZ/ConvertZZ.exe`；`settings-v2.json` 與程式同目錄可整包帶走；不支援應用程式內自動更新 |
            | Linux x64（建議） | [`ConvertZZ_${{ env.RELEASE_VERSION }}_amd64.AppImage`](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/ConvertZZ_${{ env.RELEASE_VERSION }}_amd64.AppImage) | 免安裝；支援應用程式內自動更新 |
            | Linux x64（DEB） | [`ConvertZZ_${{ env.RELEASE_VERSION }}_amd64.deb`](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/ConvertZZ_${{ env.RELEASE_VERSION }}_amd64.deb) | 以 APT 安裝；請改從本頁下載更新 |
            | Linux x64（RPM） | [`ConvertZZ-${{ env.RELEASE_VERSION }}-1.x86_64.rpm`](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/ConvertZZ-${{ env.RELEASE_VERSION }}-1.x86_64.rpm) | 以 DNF 安裝；請改從本頁下載更新 |

            Windows 安裝程式與 Linux AppImage 可用應用程式內自動更新。

            自動更新會驗證 latest.json 與安裝包簽章。

            DEB、RPM 與 Windows 免安裝 zip 請改從本頁下載。

            所有發行檔仍可用隨附的 SHA-256 檔案驗證。
          files: artifacts/**/*
