[package]
name = "convertzz"
version.workspace = true
description = "Cross-platform Chinese text conversion desktop application"
authors = ["ConvertZZ contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/flier268/ConvertZZ"
edition = "2021"
rust-version = "1.100"
default-run = "convertzz"

[workspace]
members = ["roundtrip-dict"]
resolver = "2"

[workspace.package]
version = "2.0.1"

[lib]
name = "convertzz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.7.0"
chardetng = "1.0.0"
chrono = { version = "0.4.45", features = ["clock"] }
cjk-convert-rs = "0.1.0"
encoding_rs = "0.8.44"
enigo = "0.6.1"
futures = { version = "0.3", default-features = false, features = ["executor", "std"] }
id3 = "1.17.3"
keyring = "4.2.0"
lofty = "0.25.5"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.6", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2.14.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
url = "2.5.8"
uuid = { version = "1", features = ["v4"] }
ws-segment-rs = "0.1.6"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[profile.dev.package."*"]
debug = 0

