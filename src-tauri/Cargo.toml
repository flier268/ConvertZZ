[package]
name = "convertzz"
version = "2.0.0"
description = "Cross-platform Chinese text conversion desktop application"
authors = ["ConvertZZ contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/flier268/ConvertZZ"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "convertzz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6.1"
enigo = "0.6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
flate2 = "1"
sha2 = "0.10"
x11rb = "0.13.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
